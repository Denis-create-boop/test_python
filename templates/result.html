{% extends 'base.html' %}

{% block title %}
    <title>result</title>
{% endblock %}

{% block content %}
    <div class="body">
        <div class="header">
            <div class="head_inside">
                <h2 class="global_text">Python is everywhere and for everyone</h2>
            </div>
        </div>
        <div class="inside_body">
            <div class="head_inside">
                <h3 class="global_text">{{ content.result }}</h3>
            </div>
            <div class="head_inside">
                <a class="start_button clean_a" href="{{ url_for('index') }}">
                    <button class="start_button_1 global_text">На главную</button></a>
                <br>
            </div>
            
        {% if content.misstakes > 0 %}
            <div class="head_inside">
                <a class="start_button clean_a" href="{{ url_for('show_misstakes') }}">
                    <button class="start_button_1 global_text">Посмотреть ошибки</button></a>
                <br>
            </div>
            <div class="head_inside">
                <a class="start_button clean_a" href="{{ url_for('index') }}">
                    <button class="start_button_1 global_text">На главную</button></a>
                <br>
            </div>
        </div>
        {% endif %}
    </div>
{% endblock %}
