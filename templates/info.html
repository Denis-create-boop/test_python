{% extends 'base.html' %}

{% block title %}
    <title>{{ context.title }}</title>
{% endblock %}


{% block content %}
    {% if context.flag %}
        <div class="head_inside">
            <h3 class="global_text">{{ context.message }}</h3>
        </div>
        <div class="head_inside">
            <a class="start_button clean_a" href="{{ url_for(context.url) }}"><button class="start_button_1 global_text">{{ context.info }}</button></a>
            <br>
        </div>
        <div class="head_inside">
            <a class="start_button clean_a" href="{{ url_for('index') }}"><button class="start_button_1 global_text">На главную</button></a>
            <br>
        </div>
        <div class="head_inside">
            <a class="start_button clean_a" href="{{ url_for('login') }}"><button class="start_button_1 global_text">Кабинет</button></a>
            <br>
        </div>
    {% else %}
        <div class="head_inside">
            <h3 class="misstake">{{ context.message }}</h3>
        </div>
        <div class="head_inside">
            <a class="start_button clean_a" href="{{ url_for('index') }}"><button class="start_button_1 global_text">На главную</button></a>
            <br>
        </div>
        <div class="head_inside">
            <a class="start_button clean_a" href="{{ url_for('login') }}"><button class="start_button_1 global_text">Войти</button></a>
            <br>
        </div>
    {% endif %}
{% endblock %}
